<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LanceWise OG image source, 1200×630</title>
    <!--
      Build-time asset only. Visitors never load this file; it exists so the
      social card can be regenerated from source instead of living in Figma.

      To produce public/og.png, screenshot the .card element at exactly
      1200×630 (see README → "Social card").
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #4a4a4a;
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(115% 90% at 82% 14%, #eefaf2 0%, #f8fff9 42%, #ffffff 78%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 78px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(46,125,50,0.11) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(46,125,50,0.11) 1px, transparent 1px);
        background-size: 88px 88px;
        -webkit-mask-image: radial-gradient(80% 75% at 70% 40%, #000, transparent 78%);
        mask-image: radial-gradient(80% 75% at 70% 40%, #000, transparent 78%);
      }
      .nodes { position: absolute; inset: 0; }
      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 44px;
      }
      .brand span {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #2d2d2d;
      }
      .brand em { font-style: normal; color: #2e7d32; }
      h1 {
        position: relative;
        font-family: 'Fraunces', Georgia, serif;
        font-size: 82px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.025em;
        color: #2d2d2d;
        max-width: 15ch;
      }
      h1 i { font-style: italic; color: #2e7d32; }
      p {
        position: relative;
        margin-top: 30px;
        max-width: 47ch;
        font-size: 25px;
        line-height: 1.45;
        color: #55605a;
      }
      .foot {
        position: relative;
        margin-top: 52px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .pill {
        background: #72db97;
        color: #1a1a1a;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        padding: 11px 22px;
        border-radius: 999px;
        font-weight: 500;
      }
      .foot small {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #2e7d32;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <svg class="nodes" viewBox="0 0 1200 630" aria-hidden="true">
        <g fill="#2e7d32" opacity="0.16">
          <circle cx="905" cy="118" r="5"/><circle cx="1010" cy="176" r="3.5"/>
          <circle cx="835" cy="212" r="4"/><circle cx="1108" cy="126" r="4.5"/>
          <circle cx="960" cy="272" r="3"/><circle cx="1075" cy="300" r="5"/>
          <circle cx="880" cy="352" r="3.5"/><circle cx="1140" cy="404" r="4"/>
          <circle cx="1005" cy="452" r="4.5"/><circle cx="912" cy="520" r="3"/>
          <circle cx="1096" cy="540" r="3.5"/><circle cx="820" cy="452" r="3"/>
        </g>
        <g stroke="#4caf50" stroke-width="1" opacity="0.18" fill="none">
          <path d="M905 118 1010 176 1108 126M1010 176 960 272 1075 300M960 272 880 352 1005 452M1075 300 1140 404 1096 540M1005 452 912 520M835 212 905 118M820 452 880 352"/>
        </g>
        <circle cx="1058" cy="232" r="34" fill="#72db97" opacity="0.16"/>
        <circle cx="1058" cy="232" r="11" fill="#72db97"/>
        <circle cx="890" cy="440" r="26" fill="#72db97" opacity="0.14"/>
        <circle cx="890" cy="440" r="8.5" fill="#72db97"/>
      </svg>

      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 16 L10 10 L16 4" fill="none" stroke="#2e7d32" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
          <g fill="#2e7d32" opacity="0.3">
            <circle cx="4" cy="4" r="1.15"/><circle cx="10" cy="4" r="1.15"/>
            <circle cx="4" cy="10" r="1.15"/><circle cx="10" cy="10" r="1.15"/>
            <circle cx="16" cy="10" r="1.15"/><circle cx="4" cy="16" r="1.15"/>
            <circle cx="10" cy="16" r="1.15"/><circle cx="16" cy="16" r="1.15"/>
          </g>
          <circle cx="16" cy="4" r="2.6" fill="#72db97"/>
        </svg>
        <span>Lance<em>Wise</em></span>
      </div>

      <h1>Stop gambling on Upwork. Start winning with <i>data</i>.</h1>
      <p>
        Know which jobs are worth your connects before you spend them.
      </p>

      <div class="foot">
        <span class="pill">30% off · 3 months</span>
        <small>Waitlist open</small>
      </div>
    </div>
  </body>
</html>
