AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LanceWise landing page: private S3 origin, CloudFront with Origin Access
  Control, and a GitHub Actions deploy role using OIDC (no long-lived keys).

# Deploy this stack in us-east-1. CloudFront requires its ACM certificate to
# live in us-east-1, and keeping the stack in the same region avoids a
# cross-region reference you would have to wire by hand.

Parameters:
  DomainName:
    Type: String
    Default: lancewise.com
    Description: Apex domain. The www variant is added as an alias automatically.

  ProjectName:
    Type: String
    Default: lancewise
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,40}[a-z0-9]$'
    Description: >
      Used to name resources. Must NOT contain dots. A dot in an S3 bucket name
      adds a label to its regional hostname, which the *.s3.<region>.amazonaws.com
      wildcard certificate does not cover, so CloudFront's origin fetch would
      fail TLS verification.

  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN, must be in us-east-1 and cover both the apex and
      www. Create and validate it BEFORE this stack, otherwise the stack sits
      in CREATE_IN_PROGRESS waiting on DNS validation.

  GitHubOrg:
    Type: String
    Default: mirabdullahdev

  GitHubRepo:
    Type: String
    Default: lanceiq
    Description: Repository name. Still 'lanceiq' unless you rename it on GitHub.

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set to false if this AWS account already has the GitHub OIDC provider.
      An account can only have one, and a second will fail the stack.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # ---------------------------------------------------------------- #
  # Origin. Private: no public read, no website hosting endpoint.
  # CloudFront is the only thing that can reach it.
  # ---------------------------------------------------------------- #
  SiteBucket:
    Type: AWS::S3::Bucket
    # Keep the bucket if the stack is deleted, so a fat-fingered
    # `cloudformation delete-stack` cannot wipe the live site.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-site'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution may read the bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Long cache for hashed assets is set per-object at upload time by the
  # workflow, so the distribution just honours origin headers.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'LanceWise landing page (${DomainName})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized: respects origin Cache-Control, which is
          # what lets index.html revalidate while /assets/* stay immutable.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          # A private S3 origin answers 403 for a missing key, not 404. Both
          # map to the single page so deep links do not show an XML error.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  # ---------------------------------------------------------------- #
  # CI/CD identity. No IAM user, no access keys: GitHub presents a
  # short-lived OIDC token and assumes this role.
  # ---------------------------------------------------------------- #
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Scoped to the main branch of one repo. A fork, a pull request,
              # or any other branch cannot assume this role.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Value: !Ref SiteBucket
    Description: Set as the S3_BUCKET GitHub secret.
  DistributionId:
    Value: !Ref Distribution
    Description: Set as the CLOUDFRONT_DISTRIBUTION_ID GitHub secret.
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Set as the AWS_ROLE_ARN GitHub secret.
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
    Description: Point your Cloudflare DNS records at this (DNS-only, not proxied).
